<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Space+Grotesk:wght@500;700&family=Sora:wght@500;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Theme 1: Neon (default) - cyberpunk: cyan + hot magenta */
:root,:root[data-theme="neon"]{--bg:#08030f;--panel:rgba(18,6,36,.72);--cell:rgba(32,10,58,.72);--line:#a43cff;--text:#fdf2ff;--muted:#c9a3ff;--x:#00f0ff;--o:#ff2bd6;--win:#fff3a8;--radius:16px;--font:'Space Grotesk',system-ui,sans-serif;--glow:0 0 14px currentColor}
/* Theme: Matrix - terminal green + amber */
:root[data-theme="matrix"]{--bg:#020a05;--panel:rgba(4,22,12,.74);--cell:rgba(6,34,18,.74);--line:#13a85a;--text:#e6fff0;--muted:#7bd9a0;--x:#39ff88;--o:#ffb000;--win:#d6ffe6;--radius:6px;--font:'JetBrains Mono',ui-monospace,monospace;--glow:0 0 14px currentColor}
/* Theme: Chase - cozy night room, cat and mouse */
:root[data-theme="chase"]{--bg:#1d1530;--panel:rgba(40,28,64,.72);--cell:rgba(58,42,92,.72);--line:#ffb347;--text:#fff4e6;--muted:#d9b8ff;--x:#ffb347;--o:#ff7a9c;--win:#fff0b3;--radius:20px;--font:'Fredoka',system-ui,sans-serif;--glow:none}
/* Theme 3: Lagoon - deep teal + sunny gold */
:root[data-theme="lagoon"]{--bg:#062f3a;--panel:rgba(11,68,82,.7);--cell:rgba(15,86,106,.72);--line:#22b8b0;--text:#e9fffb;--muted:#9fdcd4;--x:#ffd166;--o:#ff8fab;--win:#7cf5c8;--radius:28px;--font:'Fredoka',system-ui,sans-serif;--glow:none}
/* Theme 4: Aurora - midnight glass, mint + pink */
:root[data-theme="aurora"]{--bg:#0a0a1c;--panel:rgba(26,22,64,.62);--cell:rgba(40,34,92,.62);--line:#6a5cff;--text:#f3f1ff;--muted:#a9a3e6;--x:#5ef2c0;--o:#ff5fa2;--win:#fff0a8;--radius:22px;--font:'Sora',system-ui,sans-serif;--glow:0 0 16px currentColor}
html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;justify-content:center;padding:20px 14px 40px;transition:background .4s,color .4s}
.app{width:100%;max-width:520px;display:grid;gap:18px;grid-template-columns:1fr;align-content:start}
header{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center}
/* Modern wordmark */
.logo{margin:0;width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,16px);font-family:'Sora','Space Grotesk',system-ui,sans-serif;font-weight:700;line-height:1}
.logo-mark{flex:none;width:clamp(42px,11vw,56px);height:auto;overflow:visible}
.logo-mark .g{stroke:var(--line);stroke-width:2.5;stroke-linecap:round;fill:none}
.logo-mark .lx,.logo-mark .lo{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards}
.logo-mark .lx{stroke:var(--x)}
.logo-mark .lo{stroke:var(--o)}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.logo-words{display:flex;gap:.5em;font-size:clamp(1.3rem,5.6vw,2.1rem);letter-spacing:.14em;text-transform:uppercase;margin-right:-.14em}
.logo-words .t1{color:var(--x);text-shadow:var(--glow)}
.logo-words .t2{color:var(--text)}
.logo-words .t3{color:var(--o);text-shadow:var(--glow)}
.logo-bar{display:block;height:3px;width:100%;border-radius:3px;background:linear-gradient(90deg,var(--x),var(--o))}
@media(prefers-reduced-motion:reduce){.logo-mark .lx,.logo-mark .lo{animation:none;stroke-dashoffset:0}}

/* 2 Players: push "vs Computer" to the right edge */
.seg.split{flex:1;justify-content:space-between}

/* Draw popup */
.banner.draw{color:var(--text);text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px var(--x)}
.banner .dr-ico{display:block;font-size:.8em;margin-bottom:.1em;text-shadow:none}

.controls{grid-column:1/-1;display:flex;gap:14px;flex-wrap:nowrap;align-items:center;justify-content:space-between}
#levels{margin-left:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg[hidden]{display:none}
.seg button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--o);color:var(--bg);border-color:var(--o);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--win);outline-offset:2px}
.status{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.score{flex:1;min-width:90px;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;text-align:center}
.score b{display:block;font-size:1.8rem;line-height:1.1}
.score span{color:var(--muted);font-size:.9rem}
.score.x b{color:var(--x)}.score.o b{color:var(--o)}
.score.active{border-color:currentColor;box-shadow:var(--glow)}
.score.x.active{color:var(--x)}.score.o.active{color:var(--o)}
.score.active span,.score.active b{color:inherit}
.board-wrap{background:var(--panel);border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.msg{height:2.8em;display:grid;place-items:center;font-size:1.3rem;line-height:1.2;text-align:center}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,420px);aspect-ratio:1}
.cell{background:var(--cell);border:2px solid var(--line);border-radius:var(--radius);cursor:pointer;font:inherit;font-size:clamp(2.6rem,12vw,4.6rem);font-weight:700;color:var(--text);display:grid;place-items:center;padding:0;min-width:0;min-height:0;line-height:1;transition:background .2s,filter .2s}
.cell:hover:not(:disabled){filter:brightness(1.15)}
.cell:focus-visible,.btn:focus-visible,.dd-menu button:focus-visible{outline:3px solid var(--win);outline-offset:2px}
.cell:disabled{cursor:default}
.cell.x{color:var(--x)}.cell.o{color:var(--o)}
.cell.x,.cell.o{text-shadow:var(--glow);animation:pop .22s ease-out}
.cell.win{background:var(--win);animation:pulse .8s ease-in-out infinite alternate}
.cell.win.x,.cell.win.o{color:#111;text-shadow:none}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes pulse{to{filter:brightness(1.12)}}
.actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.actions #again{grid-column:2}
.actions #histBtn{grid-column:1;grid-row:1;justify-self:start;white-space:nowrap;font-size:.8rem;padding:5px 11px;opacity:.9}
#histBtn[aria-expanded="true"]{background:var(--o);color:var(--bg);border-color:var(--o);font-weight:700}
.btn{font:inherit;font-size:1.05rem;color:var(--text);background:var(--cell);border:2px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.btn.primary{background:var(--ng,var(--x));color:var(--ngt,var(--bg));border-color:var(--ng,var(--x));font-weight:700;transition:background .25s,border-color .25s}
.btn.primary.flash{animation:flash .4s ease-out}
@keyframes flash{0%{filter:brightness(1)}40%{filter:brightness(1.4)}100%{filter:brightness(1)}}
.stage{display:grid;width:min(100%,420px)}
.stage>.board,.stage>.history{grid-area:1/1;width:100%}
.board.veil{visibility:hidden;pointer-events:none}
.history{height:0;min-height:100%;overflow:hidden;background:var(--cell);border:2px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;animation:pop .22s ease-out}
.history[hidden]{display:none}
.history h2{margin:0;font-size:1.3rem;display:flex;justify-content:space-between;align-items:center}
.history h2 button{font:inherit;font-size:.9rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#list li{background:var(--panel);border-left:5px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:1rem}
#list li.x{border-left-color:var(--x)}#list li.o{border-left-color:var(--o)}
#list small{color:var(--muted);display:block;font-size:.85rem}
.empty{color:var(--muted)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.board-wrap,.history,.score{backdrop-filter:blur(6px)}
.timer{display:flex;align-items:center;gap:8px;font-size:1.1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.timer .dot{width:10px;height:10px;border-radius:50%;background:#2ee66b;animation:ping 1.4s infinite}
.timer.paused .dot{background:var(--muted);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(46,230,107,.7)}70%,100%{box-shadow:0 0 0 10px rgba(46,230,107,0)}}
.score.active{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.2)}}
.cell{position:relative;overflow:hidden}
.cell:hover:not(:disabled){background:radial-gradient(circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--text) 16%,var(--cell)),var(--cell) 75%)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.4;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(12);opacity:0}}
@media(prefers-reduced-motion:reduce){.score.active,.timer .dot,.ripple{animation:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.4);z-index:60;pointer-events:none;font-size:clamp(3rem,14vw,7rem);font-weight:700;color:var(--win);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px var(--win);opacity:0;white-space:nowrap;text-align:center}
.banner small{display:block;font-size:.3em;color:var(--text);text-shadow:none}
.banner.show{animation:banner 2.6s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.board{position:relative}
#strike{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
#strike line{stroke:var(--win);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--win)) drop-shadow(0 0 2px #000);stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.cell,.cell.win{animation:none}#strike line{animation:none;stroke-dashoffset:0}}

.sad-big{position:fixed;left:50%;top:38%;font-size:clamp(5rem,26vw,11rem);line-height:1;z-index:60;pointer-events:none;opacity:0;animation:sadpop 2.6s ease-out forwards}
@keyframes sadpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-15deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}32%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-45%) scale(1)}100%{opacity:0;transform:translate(-50%,-35%) scale(1)}}
.tear{position:fixed;top:-3rem;z-index:55;pointer-events:none;font-size:1.7rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(25deg)}}
.score{position:relative}
.sad-mini{position:absolute;top:-22px;right:-8px;font-size:2.6rem;line-height:1;pointer-events:none;z-index:6;animation:minipop 2.6s ease-out forwards}
@keyframes minipop{0%{opacity:0;transform:scale(.2) rotate(-20deg)}20%{opacity:1;transform:scale(1.3) rotate(10deg)}35%{transform:scale(1) rotate(-5deg)}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.tear{display:none}}

/* Dropdowns (theme + difficulty) */
.tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.dd{position:relative}
#mute{min-width:0;justify-content:center}
#mute[aria-pressed="false"] b{color:var(--muted)}
.dd[hidden],.dd-menu[hidden]{display:none}
.dd-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 9px;font-size:.8rem;line-height:1.2}
.dd-btn .k{color:var(--muted)}
.dd-btn b{font-weight:700}
.chev{width:9px;height:9px;margin-left:1px;transition:transform .2s}
.dd.open .chev{transform:rotate(180deg)}
.dd.open .dd-btn{border-color:var(--x)}
.dd-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:250px;display:flex;flex-direction:column;gap:4px;padding:6px;background:color-mix(in srgb,var(--bg),var(--text) 9%);border:2px solid var(--line);border-radius:calc(var(--radius) + 2px);box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(10px);transform-origin:top left;animation:ddin .16s ease-out}
.dd-menu.right{left:auto;right:0;transform-origin:top right}
@keyframes ddin{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.dd-menu button{font:inherit;color:var(--text);background:none;border:2px solid transparent;border-radius:calc(var(--radius) - 2px);padding:9px 10px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font-size:1.05rem}
.dd-menu button:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}
.dd-menu button[aria-pressed="true"]{border-color:var(--x);background:color-mix(in srgb,var(--x) 14%,transparent)}
.dd-menu small{display:block;color:var(--muted);font-size:.8rem;margin-top:1px}
.sw{flex:none;width:34px;height:22px;border-radius:999px;border:2px solid var(--line);background:linear-gradient(110deg,var(--s1) 0 38%,var(--s2) 38% 69%,var(--s3) 69%)}
.dd-btn .sw{width:20px;height:12px;border-width:1.5px}
.dd-btn .dot{width:10px;height:10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--d) 28%,transparent)}
.sw[data-t="neon"]{--s1:#08030f;--s2:#00f0ff;--s3:#ff2bd6}
.sw[data-t="matrix"]{--s1:#020a05;--s2:#39ff88;--s3:#ffb000}
.sw[data-t="chase"]{--s1:#1d1530;--s2:#ffb347;--s3:#ff7a9c}
.sw[data-t="lagoon"]{--s1:#062f3a;--s2:#ffd166;--s3:#ff8fab}
.sw[data-t="aurora"]{--s1:#0a0a1c;--s2:#5ef2c0;--s3:#ff5fa2}
.dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--d);box-shadow:0 0 0 3px color-mix(in srgb,var(--d) 28%,transparent)}
.dot[data-l="Easy"]{--d:#34d399}.dot[data-l="Medium"]{--d:#fbbf24}.dot[data-l="Hard"]{--d:#f43f5e}
.dd-menu .dot{margin:0 10px 0 6px}
@media(max-width:420px){.dd-menu{min-width:min(250px,calc(100vw - 28px))}}
@media(prefers-reduced-motion:reduce){.dd-menu{animation:none}.chev{transition:none}}

/* Lamp: colours come from the active theme template */
:root,:root[data-theme="neon"]{--lamp:#00f0ff;--lampbody:#12061f}
:root[data-theme="matrix"]{--lamp:#39ff88;--lampbody:#04140a}
:root[data-theme="chase"]{--lamp:#ffb347;--lampbody:#1a1030}
:root[data-theme="lagoon"]{--lamp:#ffd166;--lampbody:#06303a}
:root[data-theme="aurora"]{--lamp:#5ef2c0;--lampbody:#14122e}
.lamp{position:fixed;left:0;bottom:env(safe-area-inset-bottom,0px);width:min(340px,62vw);z-index:4;pointer-events:none}
.lamp svg{display:block;width:100%;height:auto;overflow:visible}
.lamp .s1{stop-color:var(--lamp);stop-opacity:.62}
.lamp .s2{stop-color:var(--lamp);stop-opacity:0}
.lamp .body{fill:var(--lampbody);stroke:var(--lamp);stroke-width:1.5;transition:stroke .4s,fill .4s}
.lamp .arm{stroke:var(--lampbody);stroke-linecap:round;filter:drop-shadow(0 0 1px var(--lamp))}
.lamp .joint{fill:none;stroke:var(--lamp);stroke-width:3}
.lamp .bulb{fill:var(--lamp);filter:drop-shadow(0 0 8px var(--lamp));transition:fill .4s,filter .4s}
.lamp .lit{transition:opacity .45s}
.lamp .string{stroke:var(--lamp);stroke-width:2}
.lamp .knob{fill:var(--lamp);stroke:var(--lampbody);stroke-width:1.5}
.lamp .cord{pointer-events:auto;cursor:pointer;outline:none}
.lamp .cord:focus-visible .knob{stroke:var(--win);stroke-width:3}
.lamp .cord:hover .knob{filter:drop-shadow(0 0 6px var(--lamp))}
.lamp .cord.pulled{animation:pull .35s ease-out}
@keyframes pull{40%{transform:translateY(12px)}}
.dim{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 14% 96%,transparent 0,rgba(2,4,14,.3) 16%,rgba(2,4,14,.62) 65%)}
body.lamp-off .dim{opacity:1}
body.lamp-off .lamp .lit{opacity:0}
body.lamp-off .lamp .bulb{fill:#5a5a63;filter:none}
.lamp.pulse .lit{animation:lpulse .9s ease-out}
.lamp.cheer .lit{animation:lcheer .5s ease-in-out 3}
.lamp.flicker .lit,.lamp.flicker .bulb{animation:lflick 1.4s steps(1) 1}
@keyframes lpulse{30%{opacity:1;filter:brightness(1.8)}}
@keyframes lcheer{50%{filter:brightness(2.2) saturate(1.4)}}
@keyframes lflick{0%{opacity:1}10%{opacity:.1}20%{opacity:.9}30%{opacity:0}45%{opacity:.7}60%{opacity:.05}80%{opacity:.5}100%{opacity:1}}
@media(max-width:1100px){body{padding-bottom:180px}}
@media(prefers-reduced-motion:reduce){.lamp .cord.pulled,.lamp.pulse .lit,.lamp.cheer .lit,.lamp.flicker .lit,.lamp.flicker .bulb{animation:none}}

/* Exit button + confirm dialog */
.actions #exitBtn{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap;font-size:.8rem;padding:5px 11px;opacity:.9}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(2,4,14,.6);backdrop-filter:blur(4px);animation:pop .2s ease-out}
.modal[hidden],.closed[hidden]{display:none}
.modal-card{width:min(100%,360px);background:color-mix(in srgb,var(--bg),var(--text) 9%);border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:24px 20px 20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.modal-card p{margin:0 0 20px;font-size:1.25rem;line-height:1.3}
.modal-actions{display:flex;gap:12px;justify-content:center}
.modal-actions .btn{min-width:90px}
.btn.danger{background:#f43f5e;border-color:#f43f5e;color:#fff;font-weight:700}
.modal .btn:focus-visible,.closed .btn:focus-visible{outline:3px solid var(--win);outline-offset:2px}
.closed{position:fixed;inset:0;z-index:110;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--bg);color:var(--text)}
.closed h2{margin:0;font-size:clamp(1.8rem,7vw,2.8rem)}
.closed p{margin:0 0 8px;color:var(--muted);font-size:1.1rem}

</style>

</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="banner" id="banner" role="status"></div>
<main class="app">
  <header>
    <h1 class="logo" aria-label="Tic Tac Toe">
      <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path class="g" d="M16 3v42M32 3v42M3 16h42M3 32h42"/>
        <path class="lx" pathLength="1" style="animation-delay:.1s" d="M5.5 5.5l8 8M13.5 5.5l-8 8"/>
        <circle class="lo" pathLength="1" style="animation-delay:.35s" cx="24" cy="24" r="5"/>
        <path class="lx" pathLength="1" style="animation-delay:.6s" d="M34.5 34.5l8 8M42.5 34.5l-8 8"/>
      </svg>
      <span class="logo-text">
        <span class="logo-words" aria-hidden="true"><span class="t1">Tic</span><span class="t2">Tac</span><span class="t3">Toe</span></span>
        <span class="logo-bar" aria-hidden="true"></span>
      </span>
    </h1>
    <div class="tools">
    <div class="dd themes" id="themeDd">
      <button class="btn dd-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu"><i class="sw" id="themeSw" data-t="neon"></i><span class="k">Theme</span><b id="themeLabel">Neon</b><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $=id=>document.getElementById(id);
let nextStart='X',starter='X',autoT,board,turn,over,moves,startedAt,score={x:0,o:0,d:0},history=[];

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* per-theme colours for the animated background (rgb triplets) */
const FX={
  neon:{name:'Neon',a:'255,43,214',m:'255,120,235',b:'0,240,255',l:'255,235,255',s:'255,214,90',scene:'cyber'},

/* dropdown buttons */
const ddClosers=[];

  ddClosers.push(set);

const closeTheme=dropdown('themeBtn','themeMenu'),closeLevel=dropdown('levelBtn','levelMenu');
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))ddClosers.forEach(f=>f(false))});
document.addEventListener('keydown',e=>{

});
document.querySelectorAll('#themeMenu button').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);if(typeof sfx!=='undefined')sfx.ui();closeTheme()});

const cells=[];
for(let i=0;i<9;i++){
  const c=document.createElement('button');
  c.className='cell';c.setAttribute('aria-label','Cell '+(i+1));
  c.onclick=()=>{if(mode==='ai'&&turn==='O')return;play(i)};
  $('board').appendChild(c);cells.push(c);
}
function drawStrike(line){
  const svg=$('strike'),b=$('board').getBoundingClientRect();
  const a=cells[line[0]].getBoundingClientRect(),z=cells[line[2]].getBoundingClientRect();
  const x1=a.left+a.width/2-b.left,y1=a.top+a.height/2-b.top,x2=z.left+z.width/2-b.left,y2=z.top+z.height/2-b.top;
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ex=dx/L*a.width*.38,ey=dy/L*a.height*.38;
  svg.setAttribute('viewBox','0 0 '+b.width+' '+b.height);
  svg.innerHTML='<line pathLength="1" x1="'+(x1-ex)+'" y1="'+(y1-ey)+'" x2="'+(x2+ex)+'" y2="'+(y2+ey)+'"/>';
}
function newGame(){
  setHistoryOpen(false);$('strike').innerHTML='';clearTimeout(aiT);clearTimeout(autoT);board=Array(9).fill('');turn=starter=(mode==='pvp'?nextStart:'X');over=false;moves=[];startedAt=Date.now();
  cells.forEach(c=>{c.textContent='';c.className='cell';c.disabled=false});
  render();
}
function render(){
  cells.forEach((c,i)=>{c.textContent=board[i];c.disabled=over||!!board[i]});

  $('so').classList.toggle('active',!over&&turn==='O');
  $('nx').textContent=score.x;$('no').textContent=score.o;$('nd').textContent=score.d;
  const nb=$('again'),isNew=over||fresh;
  nb.textContent=isNew?'New game':'End game';
  nb.classList.toggle('primary',isNew);
  if(!over)$('msg').textContent=mode==='ai'?(turn==='X'?'Your turn':'Computer is thinking…'):'Player '+turn+'’s turn';
}
function play(i){
  if(over||board[i])return;
  board[i]=turn;moves.push(i);fresh=false;sfx[turn==='X'?'x':'o']();
  cells[i].className='cell '+turn.toLowerCase();
  const line=LINES.find(l=>l.every(k=>board[k]===turn));
  if(line){finish(turn,line);return}
  if(board.every(Boolean)){finish(null);return}
  turn=turn==='X'?'O':'X';render();aiMove();
}
function finish(w,line){
  over=true;
  if(mode==='pvp')nextStart=w?(w==='X'?'O':'X'):(starter==='X'?'O':'X'); /* loser starts next; on a draw, swap starter */
  if(w){
    score[w.toLowerCase()]++;
    line.forEach(k=>cells[k].classList.add('win'));drawStrike(line);
    if(mode==='ai'&&w==='O'){$('msg').textContent='Computer wins. Try again!';sfx.lose();showLose()}
    else{$('msg').textContent=mode==='ai'?'You win!':'Player '+w+' wins!';sfx.win();showWin(w);if(mode!=='ai')sadMini(w==='X'?'o':'x')}
  }else{score.d++;sfx.draw();showDraw();$('msg').textContent='It’s a draw. Play again?'}
  history.unshift({r:w||'draw',v:mode==='ai'?level:'2P',m:moves.length,t:Math.max(1,Math.round((Date.now()-startedAt)/1000)),at:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  history=history.slice(0,30);
  store.set('ttt-history',history);store.set('ttt-score',score);
  render();renderHistory();
  scheduleNext();
}

const NEXT_DELAY=3000;
function scheduleNext(){
  clearTimeout(autoT);
  autoT=setTimeout(function go(){
    if(!over)return;
    if(histOpen||exitOpen){autoT=setTimeout(go,1000);return}
    newGame();
  },NEXT_DELAY);
}
function endGame(){
  if(over)return;
  clearTimeout(aiT);clearTimeout(autoT);over=true;sfx.end();
  if(moves.length){
  history.unshift({r:'ended',v:mode==='ai'?level:'2P',m:moves.length,t:Math.max(1,Math.round((Date.now()-startedAt)/1000)),at:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  history=history.slice(0,30);
  store.set('ttt-history',history);
  }
  render();
  $('msg').textContent='Game ended. Press New game to play again.';
  renderHistory();
}const NG=['#ff9f1c','#2ec4b6','#e71d36','#9b5de5','#06d6a0','#f15bb5'];let ngI=-1;
$('again').onclick=()=>{
  const b=$('again');
  if(!over&&!fresh){endGame();return}
  fresh=false;sfx.ui();
  ngI=(ngI+1)%NG.length;
  b.style.setProperty('--ng',NG[ngI]);b.style.setProperty('--ngt','#111');
  b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');
  newGame();
};

let histOpen=false;
function paintHistBtn(){
  const b=$('histBtn');
  b.textContent=histOpen?'← Back':'📜'+(history.length?' '+history.length:'');
  b.setAttribute('aria-label',histOpen?'Back to game':'History');b.title=histOpen?'Back to game':'History';
  b.setAttribute('aria-expanded',histOpen);
}
function setHistoryOpen(o){
  histOpen=o;$('board').classList.toggle('veil',o);$('history').hidden=!o;paintHistBtn();
}
$('histBtn').onclick=()=>{if(sfx.ui)sfx.ui();setHistoryOpen(!histOpen)};
function renderHistory(){
  paintHistBtn();
  const ul=$('list');ul.innerHTML='';
  if(!history.length){ul.innerHTML='<li class="empty">No games yet. Finish a round to see it here.</li>';return}
  history.forEach((h,i)=>{
    const li=document.createElement('li');
    li.className=h.r==='draw'?'':h.r.toLowerCase();
    const n=history.length-i;
    const ai=h.v&&h.v!=='2P';
    li.innerHTML='<span>Game '+n+': <b>'+(h.r==='draw'?'Draw':h.r==='ended'?'Ended early':ai?(h.r==='X'?'You won':'Computer won'):'Player '+h.r+' won')+'</b><small>'+(ai?'vs '+h.v+' computer, ':'')+h.m+' moves, '+h.t+'s</small></span><small>'+h.at+'</small>';

  });
}
$('clear').onclick=()=>{history=[];score={x:0,o:0,d:0};store.set('ttt-history',history);store.set('ttt-score',score);renderHistory();render()};


function sadRain(em){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  em=em||['😢','😭','☔','💧'];
  for(let i=0;i<22;i++){
    const t=document.createElement('span');
    t.className='tear';t.textContent=em[i%em.length];
    t.style.left=(Math.random()*96)+'vw';
    t.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    t.style.animationDelay=(Math.random()*.9)+'s';
    document.body.appendChild(t);setTimeout(()=>t.remove(),4800);
  }
}
function showDraw(){
  const b=$('banner');
  b.innerHTML='<span class="dr-ico" aria-hidden="true">🤝</span>Draw!<small>Nobody wins this round</small>';
  b.classList.remove('show');b.classList.add('draw');void b.offsetWidth;b.classList.add('show');
  sadRain(['✏️','🖍️','🤝','🎨']);
}
function showLose(){
  const e=document.createElement('div');
  e.className='sad-big';e.textContent='😭';e.setAttribute('aria-hidden','true');
  document.body.appendChild(e);setTimeout(()=>e.remove(),2700);
  sadRain();
}
function sadMini(side){
  const card=$(side==='x'?'sx':'so'),e=document.createElement('span');
  e.className='sad-mini';e.textContent='😢';e.setAttribute('aria-hidden','true');
  card.appendChild(e);setTimeout(()=>e.remove(),2700);
}

const cv=$('fx'),ctx=cv.getContext('2d');let parts=[],raf=null;
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
function burst(x,y){
  const hue=Math.random()*360,n=90;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,s=2+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue+Math.random()*40,r:2+Math.random()*1.5});
  }
}
function loop(){
  ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life>0.02);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.vy*=.985;p.life*=.97;
    ctx.fillStyle='hsla('+p.hue+',100%,60%,'+p.life+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.5,0,7);ctx.fill();
  }
  if(parts.length||active)raf=requestAnimationFrame(loop);
  else{raf=null;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
let active=false;
function showWin(w){
  const b=$('banner');
  b.innerHTML='You win!<small>'+(mode==='ai'?'You beat the '+level+' computer':'Player '+w+' takes the round')+'</small>';
  b.classList.remove('show','draw');void b.offsetWidth;b.classList.add('show');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  active=true;let n=0;
  const t=setInterval(()=>{
    burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4));sfx.boom();
    if(++n>=12){clearInterval(t);active=false}
  },280);
  burst(innerWidth/2,innerHeight*.35);sfx.boom();
  if(!raf)loop();
}

const bgc=$('bg'),bx=bgc.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,T0=performance.now();
let W=0,H=0,S=1,dark=1,bgCol='#030a26',fr=0,px=0,py=0,tx=0,ty=0,bolt=null,boltAt=-9,boltNext=0;
function hexLum(c){c=c.trim();if(c[0]!=='#')return 0;if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return(parseInt(c.slice(1,3),16)*.3+parseInt(c.slice(3,5),16)*.6+parseInt(c.slice(5,7),16)*.1)/255}
function bgInit(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);bgc.width=W*d;bgc.height=H*d;bx.setTransform(d,0,0,d,0,0);S=Math.max(.55,Math.min(1.4,Math.min(W,H)/620));D=d;skyKey=null;bub=Array.from({length:Math.round(W/22)},()=>({x:Math.random()*W,y0:Math.random()*H,r:(2+Math.random()*6)*S,v:20+Math.random()*50,ph:Math.random()*6.28}));stars=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()*1.3+.3,ph:Math.random()*6.28}));kelp=Array.from({length:Math.ceil(W/70)+1},(_,i)=>({x:i*70+Math.random()*40,h:110+Math.random()*130,ph:Math.random()*6.28,d:i%2}));mcols=Array.from({length:Math.ceil(W/(18*S))},()=>({o:Math.random()*1000,v:4+Math.random()*9,l:10+Math.floor(Math.random()*18)}));drops=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*(W+240)-20,y0:Math.random()*H,v:520+Math.random()*520,l:10+Math.random()*16}));const sc=document.createElement('canvas');sc.width=1;sc.height=4;const sg=sc.getContext('2d');sg.fillStyle='rgba(0,0,0,.24)';sg.fillRect(0,0,1,1);scan=bx.createPattern(sc,'repeat')}
function haze(x,y,r,rgb,a){const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');bx.fillStyle=g;bx.beginPath();bx.arc(x,y,r,0,6.283);bx.fill()}

function rnd(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* static skyline, redrawn only on resize / theme change */
function buildSky(){
  const HZ=H*.62,r=rnd(7),c=document.createElement('canvas');c.width=W*D;c.height=H*D;
  const g=c.getContext('2d');g.setTransform(D,0,0,D,0,0);
  const layers=[
    {fill:'rgb(26,9,50)',min:.10,max:.26,wmin:26,wmax:60,lit:.12,al:.45,edge:.35,sign:0,far:1},
    {fill:'rgb(8,3,18)',min:.16,max:.42,wmin:38,wmax:96,lit:.34,al:.9,edge:.9,sign:1,far:0}

  c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
});

/* sound (Web Audio, no files needed) */
let sfxOn=store.get('ttt-sound')!==false,AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,vol,slide){
  const a=ac();if(!a||!sfxOn)return;
  const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,s);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.05);
}
function noise(t0,d,vol,fq){
  const a=ac();if(!a||!sfxOn)return;
  const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
  for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
  const src=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter(),s=a.currentTime+t0;
  src.buffer=buf;fl.type='lowpass';fl.frequency.value=fq||1200;
  g.gain.setValueAtTime(vol||.3,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  src.connect(fl).connect(g).connect(a.destination);src.start(s);
}
const sfx={
  x(){tone(520,0,.12,'triangle',.22)},
  o(){tone(380,0,.12,'triangle',.22)},
  ui(){tone(300,0,.08,'square',.1,450)},
  end(){tone(300,0,.2,'sawtooth',.12,120)},
  draw(){tone(330,0,.18,'sine',.2);tone(294,.18,.18,'sine',.2);tone(262,.36,.3,'sine',.2)},
  lose(){tone(392,0,.2,'sawtooth',.14);tone(330,.2,.2,'sawtooth',.14);tone(262,.4,.4,'sawtooth',.14,200)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.25,'triangle',.25));tone(1047,.6,.6,'sine',.2)},
  boom(){tone(160,0,.35,'sine',.3,40);noise(0,.3,.25,500);noise(.15,.5,.1,6000)}
};
function paintMute(){$('muteIco').textContent=sfxOn?'🔊':'🔇';$('muteLabel').textContent=sfxOn?'On':'Off';$('mute').setAttribute('aria-pressed',sfxOn)}
$('mute').onclick=()=>{sfxOn=!sfxOn;store.set('ttt-sound',sfxOn);paintMute();if(sfxOn)sfx.ui()};
paintMute();

let mode='pvp',level='Medium',aiT,fresh=true;
function winner(b){for(const l of LINES)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]];return b.every(Boolean)?'d':null}
function minimax(b,p,d){
  const w=winner(b);
  if(w==='O')return 10-d;if(w==='X')return d-10;if(w==='d')return 0;
  let best=p==='O'?-99:99;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=minimax(b,p==='O'?'X':'O',d+1);b[i]='';best=p==='O'?Math.max(best,s):Math.min(best,s)}
  return best;
}
function bestMove(){
  let bs=-99,bm=[];
  for(let i=0;i<9;i++)if(!board[i]){board[i]='O';const s=minimax(board,'X',1);board[i]='';if(s>bs){bs=s;bm=[i]}else if(s===bs)bm.push(i)}
  return bm[Math.random()*bm.length|0];
}
function immediate(p){
  for(const l of LINES){const v=l.map(k=>board[k]);if(v.filter(x=>x===p).length===2&&v.includes(''))return l[v.indexOf('')]}
  return -1;
}
function randomMove(){const e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);return e[Math.random()*e.length|0]}
function pickMove(){
  if(level==='Hard')return bestMove();
  if(level==='Medium'){
    let m=immediate('O');
    if(m<0&&Math.random()<.75)m=immediate('X');
    return m>=0?m:randomMove();
  }
  return randomMove();
}
function aiMove(){
  if(mode!=='ai'||over||turn!=='O')return;
  aiT=setTimeout(()=>{if(!over&&turn==='O')play(pickMove())},500);
}
function setMode(m,l){
  mode=m;level=l;nextStart='X';
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#levelMenu button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===level));
  $('levelLabel').textContent=level;$('levelDot').dataset.l=level;
  $('levels').hidden=mode!=='ai';
  $('modes').classList.toggle('split',mode==='pvp');
  $('lx').textContent=mode==='ai'?'You (X)':'Player X';
  $('lo').textContent=mode==='ai'?'Computer (O)':'Player O';
  store.set('ttt-mode',{m:mode,l:level});
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m,level);newGame()});
document.querySelectorAll('#levelMenu button').forEach(b=>b.onclick=()=>{setMode(mode,b.dataset.l);sfx.ui();closeLevel();newGame()});
const sm=store.get('ttt-mode');
if(sm&&sm.m&&sm.l)setMode(sm.m,sm.l);

setTheme(store.get('ttt-theme')||'neon');
history=store.get('ttt-history')||[];
score=store.get('ttt-score')||{x:0,o:0,d:0};
renderHistory();newGame();

sfx.pull=()=>{tone(1400,0,.03,'square',.08);tone(700,.05,.06,'square',.08)};
const lampEl=$('lamp'),cord=$('cord');
let lampOn=store.get('ttt-lamp')!==false;
function paintLamp(){document.body.classList.toggle('lamp-off',!lampOn);cord.setAttribute('aria-pressed',lampOn)}
function toggleLamp(){
  lampOn=!lampOn;store.set('ttt-lamp',lampOn);sfx.pull();paintLamp();
  cord.classList.remove('pulled');void cord.getBoundingClientRect();cord.classList.add('pulled');
}
cord.onclick=toggleLamp;
cord.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleLamp()}};
function lampReact(k){
  if(!lampOn)return;
  lampEl.classList.remove('pulse','cheer','flicker');void lampEl.offsetWidth;lampEl.classList.add(k);
  setTimeout(()=>lampEl.classList.remove(k),1600);
}
const _play=play;play=function(i){const n=moves.length;_play(i);if(moves.length>n&&!over)lampReact('pulse')};
const _win=showWin;showWin=function(w){_win(w);lampReact('cheer')};
const _lose=showLose;showLose=function(){_lose();lampReact('flicker')};
paintLamp();

/* Exit game: confirm, then close */
const exitModal=$('exitModal'),closedScreen=$('closedScreen');
let exitOpen=false;
function setExit(o){exitOpen=o;exitModal.hidden=!o;if(o)$('exitNo').focus()}
function closeGame(){
  clearTimeout(aiT);clearTimeout(autoT);over=true;
  closedScreen.hidden=false;$('playAgain').focus();
  try{window.close()}catch(e){}
}
$('exitBtn').onclick=()=>{sfx.ui();setExit(true)};
$('exitNo').onclick=()=>{sfx.ui();setExit(false);$('exitBtn').focus()};
$('exitYes').onclick=()=>{sfx.end();setExit(false);closeGame()};
exitModal.addEventListener('click',e=>{if(e.target===exitModal)$('exitNo').click()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&exitOpen)$('exitNo').click()});
$('playAgain').onclick=()=>{sfx.ui();closedScreen.hidden=true;newGame()};

</script>
